name: Deploy Chao Ngo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chao-ngo-production
  cancel-in-progress: true

jobs:
  inspect-data:
    # Manual runs on feature branches inspect production without deploying.
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read migration ledger, schema and aggregate game data
        run: |
          npx wrangler d1 migrations list DB --remote
          npx wrangler d1 execute DB --remote --command "SELECT name FROM sqlite_master WHERE type = 'table'" --json
          npx wrangler d1 execute DB --remote --command "SELECT COUNT(*) AS saved_profiles FROM user_profiles" --json
          node scripts/check-game-data.mjs --remote --report-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c24fed68f8dc59cc339bd821d215bba8
          WRANGLER_LOG_PATH: ${{ runner.temp }}/chao-ngo-data-check.log

  deploy:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types, lint, handlers and migrations
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c24fed68f8dc59cc339bd821d215bba8
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

          whoami_output="$(npx wrangler whoami 2>&1)" || {
            echo "Cloudflare authentication failed. Use an API token authorized for the CreativelabTH Group account."
            exit 1
          }

          if ! grep -Fq "$CLOUDFLARE_ACCOUNT_ID" <<<"$whoami_output"; then
            echo "Cloudflare token is not authorized for the configured production account."
            echo "Expected account: $CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          echo "Cloudflare credentials target the configured production account."

      - name: Verify Turnstile site key
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}" ]; then
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY is not configured."
            exit 1
          fi
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAFAv4gMFljB7eBAU

      - name: Verify Google OAuth runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c24fed68f8dc59cc339bd821d215bba8
        run: |
          set -euo pipefail
          # Check names only. OAuth values stay in Cloudflare and are never copied into CI.
          npx wrangler secret list --format json > "$RUNNER_TEMP/chao-ngo-secret-names.json"
          node -e 'const fs = require("node:fs"); const secrets = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!Array.isArray(secrets)) throw new Error("Invalid secret metadata"); const names = new Set(secrets.map(secret => secret.name)); const missing = ["GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET"].filter(name => !names.has(name)); if (missing.length) { console.error("Configure Worker secrets before switching production auth: " + missing.join(", ")); process.exit(1); } console.log("Google OAuth runtime secrets are present; preserving their values.");' "$RUNNER_TEMP/chao-ngo-secret-names.json"

      - name: Verify production schema and stored game data
        run: node scripts/check-game-data.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c24fed68f8dc59cc339bd821d215bba8
          WRANGLER_LOG_PATH: ${{ runner.temp }}/chao-ngo-data-check.log

      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c24fed68f8dc59cc339bd821d215bba8
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAFAv4gMFljB7eBAU
