name: Diagnose pretest loading
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chao-ngo-pretest-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture aggregate pretest errors without user data
        run: node scripts/tail-pretest-diagnostics.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c24fed68f8dc59cc339bd821d215bba8
          WRANGLER_LOG_PATH: ${{ runner.temp }}/pretest-diagnostics.log
